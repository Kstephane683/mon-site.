name: Contrôle des secrets

# Demande de l'agent CHATBOT (journal 18/09/2026 22:15) : le hook pre-push posé
# sur cette machine protège la machine, pas le dépôt. Ce workflow est la
# protection du dépôt.
# Contexte : quatre secrets de production vivaient en clair dans des dépôts
# publics, tous vérifiés actifs — dont un jeton d'API dans ce dépôt-ci.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Vérifier qu'aucun secret n'est versionné
        run: python3 scripts/verifier-secrets.py
