<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Trois règles d&#x27;arrêt d&#x27;une campagne : coût par résultat au-dessus du plafond, deux semaines sans vente, budget épuisé sans conversion"><title>Trois règles d&#x27;arrêt d&#x27;une campagne : coût par résultat au-dessus du plafond, deux semaines sans vente, budget épuisé sans conversion</title>
