<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="ROAS réel : un ROAS de 2 avec 30% de marge laisse 0,60 de marge par franc dépensé"><title>ROAS réel : un ROAS de 2 avec 30% de marge laisse 0,60 de marge par franc dépensé</title>
<rect width="1200" height="675" fill="#17151a"/>
<rect x="30" y="30" width="1140" height="615" fill="none" stroke="#4c3d27"/>
<text x="80" y="92" font-family="Georgia,serif" font-size="26" font-weight="700" fill="#fdfcfa">e<tspan fill="#c9a96e">P</tspan>erformance</text>
<text x="80" y="130" font-family="Arial,sans-serif" font-size="11" letter-spacing="3" fill="#c9a96e">LE ROAS RÉEL</text>
<text x="80" y="196" font-family="Georgia,serif" font-size="34" fill="#fdfcfa">Un ROAS de 2 ne dit pas la marge</text>
<g font-family="Arial,sans-serif"><text x="80" y="296" font-size="12" letter-spacing="2" fill="#8f8574">ROAS AFFICHÉ</text><text x="80" y="334" font-size="30" fill="#e9e1d2">2 (2 F de ventes par 1 F dépensé)</text><rect x="80" y="352" width="1040" height="12" rx="6" fill="#6f5c3b"/><text x="80" y="406" font-size="12" letter-spacing="2" fill="#8f8574">MARGE NETTE</text><text x="80" y="444" font-size="30" fill="#c9a96e">30 %</text><rect x="80" y="462" width="572" height="12" rx="6" fill="#6f5c3b"/><text x="80" y="516" font-size="12" letter-spacing="2" fill="#8f8574">MARGE RESTANTE PAR FRANC</text><text x="80" y="554" font-size="30" fill="#c9a96e">0,60 F</text><rect x="80" y="572" width="312" height="12" rx="6" fill="#6f5c3b"/></g>
<line x1="30" y1="620" x2="1170" y2="620" stroke="#4c3d27"/>
</svg>