<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Combien coûte une formation Meta Ads : trois prix publics, trois calculs, sept questions">
<rect width="1200" height="675" fill="#17151a"/><rect x="30" y="30" width="1140" height="615" fill="none" stroke="#4c3d27"/>
<text x="110" y="92" font-family="Georgia,serif" font-size="30" font-weight="700" fill="#fdfcfa">e<tspan fill="#c9a96e">P</tspan>erformance</text>
<text x="110" y="145" font-family="Arial,sans-serif" font-size="12" letter-spacing="3" fill="#c9a96e">FORMATION · TARIFS PUBLICS</text>
<text x="110" y="215" font-family="Georgia,serif" font-size="54" font-weight="600" fill="#fdfcfa">Combien coûte une</text>
<text x="110" y="277" font-family="Georgia,serif" font-size="54" font-weight="600" fill="#fdfcfa">formation Meta Ads</text>
<text x="110" y="352" font-family="Arial,sans-serif" font-size="16" fill="#b9b0a0">Trois prix affichés, trois calculs de seuil,</text>
<text x="110" y="378" font-family="Arial,sans-serif" font-size="16" fill="#b9b0a0">sept questions à poser avant de payer.</text>
<line x1="110" y1="440" x2="478" y2="440" stroke="#c9a96e"/>
<text x="110" y="500" font-family="Georgia,serif" font-size="36" fill="#c9a96e">Vérifier.</text>
<text x="110" y="545" font-family="Georgia,serif" font-size="36" fill="#c9a96e">Puis décider.</text>
<text x="780" y="135" font-family="Arial,sans-serif" font-size="12" letter-spacing="3" fill="#c9a96e">LES TROIS PARCOURS</text>
<text x="780" y="160" font-family="Arial,sans-serif" font-size="13" fill="#8f8574">Prix publics, séances de 90 minutes.</text>
<rect x="780" y="180" width="320" height="64" rx="4" fill="none" stroke="#6f5c3b"/>
<text x="798" y="208" font-family="Arial,sans-serif" font-size="16" fill="#e9e1d2">Publicité rentable</text>
<text x="798" y="230" font-family="Arial,sans-serif" font-size="12" fill="#8f8574">3 séances · 150 000 FCFA</text>
