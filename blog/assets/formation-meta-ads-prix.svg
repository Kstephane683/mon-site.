<text x="798" y="284" font-family="Arial,sans-serif" font-size="16" fill="#e9e1d2">Meta Ads</text>
<text x="798" y="306" font-family="Arial,sans-serif" font-size="12" fill="#8f8574">4 séances · 190 000 FCFA</text>
<rect x="780" y="332" width="320" height="64" rx="4" fill="none" stroke="#6f5c3b"/>
<text x="798" y="360" font-family="Arial,sans-serif" font-size="16" fill="#e9e1d2">Pack Duo</text>
<text x="798" y="382" font-family="Arial,sans-serif" font-size="12" fill="#8f8574">7 séances · 280 000 FCFA</text>
<line x1="780" y1="424" x2="1100" y2="424" stroke="#4c3d27"/>
<text x="780" y="452" font-family="Arial,sans-serif" font-size="12" fill="#8f8574">Aucun résultat financier garanti.</text>
