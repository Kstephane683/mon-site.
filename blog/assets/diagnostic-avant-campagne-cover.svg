<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Diagnostic avant campagne : marge nette, CAC plafond, LTV et payback">
<rect width="1200" height="675" fill="#17151a"/><rect x="30" y="30" width="1140" height="615" fill="none" stroke="#4c3d27"/>
<text x="110" y="92" font-family="Georgia,serif" font-size="30" font-weight="700" fill="#fdfcfa">e<tspan fill="#c9a96e">P</tspan>erformance</text>
<text x="110" y="145" font-family="Arial,sans-serif" font-size="12" letter-spacing="3" fill="#c9a96e">ACQUISITION · DIAGNOSTIC</text>
<text x="110" y="215" font-family="Georgia,serif" font-size="54" font-weight="600" fill="#fdfcfa">Diagnostic avant</text>
<text x="110" y="277" font-family="Georgia,serif" font-size="54" font-weight="600" fill="#fdfcfa">campagne</text>
<text x="110" y="360" font-family="Arial,sans-serif" font-size="16" fill="#b9b0a0">Quatre chiffres calculés avec vos ventes,</text>
<text x="110" y="386" font-family="Arial,sans-serif" font-size="16" fill="#b9b0a0">pas avec une moyenne du marché.</text>
<line x1="110" y1="440" x2="478" y2="440" stroke="#c9a96e"/>
<text x="110" y="500" font-family="Georgia,serif" font-size="36" fill="#c9a96e">Mesurer.</text>
<text x="110" y="545" font-family="Georgia,serif" font-size="36" fill="#c9a96e">Puis décider.</text>
<text x="780" y="135" font-family="Arial,sans-serif" font-size="12" letter-spacing="3" fill="#c9a96e">LES QUATRE CHIFFRES</text>
<text x="780" y="160" font-family="Arial,sans-serif" font-size="13" fill="#8f8574">Ce que le rapport doit montrer.</text>
<rect x="780" y="180" width="320" height="60" rx="4" fill="none" stroke="#6f5c3b"/>
<text x="798" y="206" font-family="Arial,sans-serif" font-size="12" fill="#c9a96e">01</text>
<text x="830" y="206" font-family="Arial,sans-serif" font-size="16" fill="#e9e1d2">Marge nette par vente</text>
<text x="830" y="227" font-family="Arial,sans-serif" font-size="12" fill="#8f8574">ce qui reste après les coûts</text>
<rect x="780" y="252" width="320" height="60" rx="4" fill="none" stroke="#6f5c3b"/>
<text x="798" y="278" font-family="Arial,sans-serif" font-size="12" fill="#c9a96e">02</text>
<text x="830" y="278" font-family="Arial,sans-serif" font-size="16" fill="#e9e1d2">CAC plafond</text>
<text x="830" y="299" font-family="Arial,sans-serif" font-size="12" fill="#8f8574">ce que vous pouvez payer</text>
<rect x="780" y="324" width="320" height="60" rx="4" fill="none" stroke="#6f5c3b"/>
<text x="798" y="350" font-family="Arial,sans-serif" font-size="12" fill="#c9a96e">03</text>
<text x="830" y="350" font-family="Arial,sans-serif" font-size="16" fill="#e9e1d2">Valeur du client</text>
<text x="830" y="371" font-family="Arial,sans-serif" font-size="12" fill="#8f8574">ce qu'il rapporte sur 12 mois</text>
<rect x="780" y="396" width="320" height="60" rx="4" fill="none" stroke="#6f5c3b"/>
<text x="798" y="422" font-family="Arial,sans-serif" font-size="12" fill="#c9a96e">04</text>
<text x="830" y="422" font-family="Arial,sans-serif" font-size="16" fill="#e9e1d2">Payback</text>
<text x="830" y="443" font-family="Arial,sans-serif" font-size="12" fill="#8f8574">quand la trésorerie revient</text>
<line x1="110" y1="610" x2="1090" y2="610" stroke="#4c3d27"/>
<text x="110" y="640" font-family="Arial,sans-serif" font-size="11" letter-spacing="2" fill="#8f8574">ACQUISITION · MESURE · DÉCISION</text>
<text x="1090" y="640" text-anchor="end" font-family="Arial,sans-serif" font-size="11" letter-spacing="2" fill="#8f8574">ePerformance · Abidjan</text>
</svg>
