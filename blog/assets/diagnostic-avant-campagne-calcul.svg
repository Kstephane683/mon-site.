<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Du panier de 25 000 FCFA à ce qui reste : 10 100 FCFA de marge, 6 000 FCFA de coût d'acquisition, 4 100 FCFA conservés">
<rect width="1200" height="675" fill="#17151a"/>
<rect x="30" y="30" width="1140" height="615" fill="none" stroke="#4c3d27"/>
<text x="80" y="92" font-family="Georgia,serif" font-size="26" font-weight="700" fill="#fdfcfa">e<tspan fill="#c9a96e">P</tspan>erformance</text>
<text x="80" y="130" font-family="Arial,sans-serif" font-size="11" letter-spacing="3" fill="#c9a96e">LE CALCUL D'UNE COMMANDE</text>

<text x="80" y="196" font-family="Georgia,serif" font-size="34" fill="#fdfcfa">Du panier à ce qui reste</text>
<text x="80" y="226" font-family="Arial,sans-serif" font-size="14" fill="#8f8574">Montants ronds, choisis pour le calcul.</text>

<g font-family="Arial,sans-serif">
  <text x="80" y="286" font-size="12" letter-spacing="2" fill="#8f8574">PRIX DE VENTE</text>
  <text x="80" y="324" font-size="30" fill="#e9e1d2">25 000 FCFA</text>
  <rect x="80" y="342" width="1040" height="10" rx="5" fill="#6f5c3b"/>

  <text x="80" y="392" font-size="12" letter-spacing="2" fill="#8f8574">COÛTS VARIABLES</text>
  <text x="80" y="430" font-size="30" fill="#c9a96e">14 900 FCFA</text>
  <rect x="80" y="448" width="620" height="10" rx="5" fill="#4c3d27"/>

  <text x="80" y="498" font-size="12" letter-spacing="2" fill="#8f8574">MARGE NETTE PAR VENTE</text>
  <text x="80" y="536" font-size="30" fill="#fdfcfa">10 100 FCFA</text>
  <rect x="80" y="554" width="420" height="10" rx="5" fill="#c9a96e"/>

  <text x="560" y="392" font-size="12" letter-spacing="2" fill="#8f8574">COÛT D'ACQUISITION</text>
  <text x="560" y="430" font-size="30" fill="#e9e1d2">6 000 FCFA</text>
  <rect x="560" y="448" width="250" height="10" rx="5" fill="#8f8574"/>

  <text x="560" y="498" font-size="12" letter-spacing="2" fill="#8f8574">CE QUI RESTE</text>
  <text x="560" y="536" font-size="30" fill="#c9a96e">4 100 FCFA</text>
  <rect x="560" y="554" width="170" height="10" rx="5" fill="#6f5c3b"/>
</g>

<line x1="80" y1="600" x2="1120" y2="600" stroke="#4c3d27"/>
<text x="80" y="628" font-family="Arial,sans-serif" font-size="11" letter-spacing="2" fill="#8f8574">MARGE NETTE 10 100 · CAC 6 000 · RESTE 4 100</text>
<text x="1120" y="628" text-anchor="end" font-family="Arial,sans-serif" font-size="11" letter-spacing="2" fill="#8f8574">ePerformance · Abidjan</text>
</svg>
